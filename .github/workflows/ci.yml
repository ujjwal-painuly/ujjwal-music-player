name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-syntax:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse every JavaScript file
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './server/node_modules/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

  api-typecheck:
    name: EchoTune API typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check API
        run: npm run typecheck

      - name: Build API
        run: npm run build
